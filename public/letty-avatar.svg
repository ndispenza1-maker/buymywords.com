<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Letty">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4845F"/>
      <stop offset="55%" stop-color="#E8998D"/>
      <stop offset="100%" stop-color="#F7B267"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#sun)"/>
  <rect width="256" height="256" fill="url(#gloss)"/>

  <circle cx="128" cy="118" r="78" fill="none" stroke="#2D2424" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="128" cy="118" r="88" fill="none" stroke="#F5D76E" stroke-opacity="0.55" stroke-width="1.5"/>

  <text x="128" y="170" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="150" font-weight="700" fill="#2D2424">L</text>

  <g fill="#2D2424" fill-opacity="0.55"
     font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
    <text x="128" y="214" text-anchor="middle" letter-spacing="7">LFH</text>
  </g>

  <rect x="0" y="0" width="256" height="256" fill="none" stroke="#2D2424" stroke-opacity="0.18" stroke-width="8"/>
</svg>
